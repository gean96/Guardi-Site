<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Guardi — Ligar Google Drive</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/guardi-icon.png">
  <style>
    :root {
      --surface: #f8f9fa;
      --text: #191c1d;
      --muted: #414754;
      --primary: #005bb3;
      --primary-strong: #003f82;
      --err: #c15143;
      --ok: #006c52;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #eef5fb 0%, var(--surface) 320px);
      color: var(--text);
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 18px 50px rgba(0, 91, 179, 0.1);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--primary-strong);
      font-weight: 800;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0; line-height: 1.5; color: var(--muted); font-size: 0.95rem; }
    .ok { color: var(--ok); font-weight: 600; margin-top: 12px; }
    .err { color: var(--err); font-weight: 600; margin-top: 12px; }
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover { background: var(--primary-strong); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/guardi-icon.png" alt="">
      Guardi
    </div>
    <h1>Google Drive</h1>
    <p id="status">A voltar para o aplicativo…</p>
    <a id="openApp" class="btn hidden" href="#">Abrir Guardi</a>
  </div>
  <script>
    (function () {
      var status = document.getElementById("status");
      var openBtn = document.getElementById("openApp");
      var params = new URLSearchParams(window.location.search || "");
      var error = (params.get("error") || "").trim();
      var errorDesc = (params.get("error_description") || "").trim();
      var code = (params.get("code") || "").trim();
      var state = (params.get("state") || "").trim();

      function deepLink(qs) {
        return "guardi://app/drive/callback" + (qs ? ("?" + qs) : "");
      }

      if (error) {
        status.textContent = errorDesc || error || "Autorização cancelada ou bloqueada.";
        status.className = "err";
        var errQs = new URLSearchParams();
        errQs.set("error", error);
        if (errorDesc) errQs.set("error_description", errorDesc);
        if (state) errQs.set("state", state);
        openBtn.href = deepLink(errQs.toString());
        openBtn.classList.remove("hidden");
        openBtn.textContent = "Voltar ao Guardi";
        return;
      }

      if (!code || !state) {
        status.textContent = "Link incompleto. Abra o Guardi e tente ligar o Drive outra vez.";
        status.className = "err";
        openBtn.href = "guardi://app/";
        openBtn.classList.remove("hidden");
        openBtn.textContent = "Abrir Guardi";
        return;
      }

      var okQs = new URLSearchParams();
      okQs.set("code", code);
      okQs.set("state", state);
      var target = deepLink(okQs.toString());
      openBtn.href = target;
      openBtn.classList.remove("hidden");
      status.textContent = "A abrir o Guardi… Se nada acontecer, toque no botão abaixo.";
      status.className = "ok";

      // Tenta o deep link automaticamente (Chrome / WebView).
      window.location.replace(target);
    })();
  </script>
</body>
</html>
